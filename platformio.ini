[platformio]
default_envs = teensy41

; --- Sequencer-Firmware ---
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    olikraus/U8g2
monitor_speed = 115200
build_src_filter = +<*> -<hwtest/>

; --- Hardware-Test ohne Display/Encoder: DACs, CV-Stufen, Gate-Treiber ---
[env:hwtest]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_src_filter = +<output.cpp> +<hwtest/>
